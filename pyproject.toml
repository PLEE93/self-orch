[project]
name = "self-orch"
version = "0.1.0"
description = "Agent-agnostic parallel self-orchestration harness. The coding agent is the governor; this CLI is the substrate rail."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lee Oren" }]
keywords = ["agents", "orchestration", "harness", "glm", "grok"]
dependencies = []

[project.scripts]
self-orch = "self_orch.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
